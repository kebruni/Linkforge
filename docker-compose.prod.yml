# Production stack for a single VPS.
# Postgres + Redis + Next.js + worker + Nginx + certbot.
# See DEPLOYMENT.md for the full bring-up procedure.
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  AUTH_SECRET: ${AUTH_SECRET}
  AUTH_TRUST_HOST: "true"
  APP_URL: ${APP_URL:-https://linkforge.kebruni.me}
  PORT: 3000
  AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
  AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
  AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
  AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-auto}
  S3_BUCKET: ${S3_BUCKET:-linkforge-assets}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  FEATURE_AI: ${FEATURE_AI:-true}
  FEATURE_BILLING: ${FEATURE_BILLING:-false}
  # Demo (fake) checkout must stay OFF in production.
  FEATURE_BILLING_DEMO: ${FEATURE_BILLING_DEMO:-false}
  FEATURE_CUSTOM_DOMAINS: ${FEATURE_CUSTOM_DOMAINS:-false}
  # Behind Nginx/Cloudflare: trust X-Forwarded-For for rate limits.
  TRUST_PROXY: ${TRUST_PROXY:-false}
  RATE_LIMIT_WRITES_PER_MIN: ${RATE_LIMIT_WRITES_PER_MIN:-60}
  RATE_LIMIT_PUBLIC_VIEWS_PER_MIN: ${RATE_LIMIT_PUBLIC_VIEWS_PER_MIN:-600}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linkforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-linkforge}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [linkforge]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linkforge} -d ${POSTGRES_DB:-linkforge}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "${REDIS_MAXMEMORY:-512mb}"
      # BullMQ requires noeviction (not allkeys-lru)
      - "--maxmemory-policy"
      - "noeviction"
    volumes:
      - redis-data:/data
    networks: [linkforge]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: linkforge:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
    networks: [linkforge]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  worker:
    image: linkforge:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["node", "dist/worker/index.js"]
    environment:
      <<: *app-env
    networks: [linkforge]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./letsencrypt/conf:/etc/letsencrypt:ro
      - ./letsencrypt/www:/var/www/certbot:ro
    networks: [linkforge]

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./letsencrypt/conf:/etc/letsencrypt
      - ./letsencrypt/www:/var/www/certbot
    entrypoint:
      - /bin/sh
      - -c
      - |
        trap exit TERM; while :; do
          certbot renew --webroot --webroot-path=/var/www/certbot --quiet
          sleep 12h & wait $${!};
        done
    networks: [linkforge]

volumes:
  postgres-data:
  redis-data:

networks:
  linkforge:
    driver: bridge
